<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 記憶力遊戲 - Memory | 記憶配對</title>
    <meta name="description" content="翻轉卡片找出配對">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/globals.css">
    <link rel="stylesheet" href="../styles/mobile-optimize.css">
    <style>
        .game-navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            gap: 1rem;
        }
        
        .nav-left { flex: 1; }
        .nav-center { flex: 1; text-align: center; }
        .nav-right { flex: 1; text-align: right; }
        
        .back-btn, .theme-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .back-btn:hover, .theme-btn:hover {
            background: rgba(255,255,255,0.4);
        }
        
        .header-title { color: white; margin: 0; font-size: 1.5rem; }
        
        body {
            background: linear-gradient(135deg, #1e1e2e 0%, #2a2a3e 100%);
            color: #fff;
            font-family: 'Noto Sans TC', sans-serif;
            padding-top: 80px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
        }
        
        .game-stats {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin: 1.5rem 0;
            flex-wrap: wrap;
        }
        
        .stat-box {
            background: rgba(102, 126, 234, 0.2);
            border: 1px solid #667eea;
            padding: 1rem;
            border-radius: 0.5rem;
            min-width: 150px;
            text-align: center;
        }
        
        .stat-label { font-size: 0.9rem; color: #aaa; }
        .stat-value { font-size: 1.8rem; font-weight: bold; color: #667eea; margin: 0.5rem 0; }
        
        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 2rem 0;
            background: rgba(102, 126, 234, 0.1);
            padding: 20px;
            border-radius: 1rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 0.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            transition: all 0.3s;
            user-select: none;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .card.flipped {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
        
        .card.matched {
            opacity: 0.5;
            cursor: default;
            pointer-events: none;
        }
        
        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin: 2rem 0;
        }
        
        .control-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        @media (max-width: 768px) {
            .game-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <!-- 導航條 -->
    <nav class="game-navbar">
        <div class="nav-left">
            <a href="../index.html" class="back-btn">← 返回主頁</a>
        </div>
        <div class="nav-center">
            <h1 class="header-title">🧠 記憶力遊戲</h1>
        </div>
        <div class="nav-right"></div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>🧠 記憶力遊戲</h1>
            <p style="color: #aaa; text-align: center;">翻轉卡片找出配對</p>
        </div>
        
        <div class="game-stats">
            <div class="stat-box">
                <div class="stat-label">移動次數</div>
                <div class="stat-value" id="moves">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">配對數</div>
                <div class="stat-value" id="matches">0/8</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">最佳紀錄</div>
                <div class="stat-value" id="bestMoves">-</div>
            </div>
        </div>
        
        <div class="game-grid" id="gameGrid"></div>
        
        <div class="controls">
            <button class="control-btn" id="newGameBtn">🎮 新遊戲</button>
            <button class="control-btn" id="difficultyBtn">⭐ 難度: 普通</button>
        </div>
    </div>

    <script src="../lib/game-utils.js"></script>
    <script src="../js/memory.js"></script>
</body>
</html>
