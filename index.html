<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>俄羅斯方塊 - Tetris</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 俄羅斯方塊</h1>
            <p class="subtitle">經典益智遊戲</p>
        </div>
        
        <div class="game-wrapper">
            <!-- 左侧信息面板 -->
            <div class="side-panel left-panel">
                <div class="info-box">
                    <h3>📊 遊戲統計</h3>
                    <div class="stat-item">
                        <span class="stat-label">分數</span>
                        <span class="stat-value" id="score">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">等級</span>
                        <span class="stat-value" id="level">1</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">消除行數</span>
                        <span class="stat-value" id="lines">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">最高分</span>
                        <span class="stat-value" id="highScore">0</span>
                    </div>
                </div>

                <div class="info-box">
                    <h3>🎯 目標</h3>
                    <p class="goal-text">消除 <span id="goalLines">10</span> 行升級！</p>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressBar"></div>
                    </div>
                </div>
            </div>

            <!-- 中间游戏区域 -->
            <div class="game-container">
                <div class="game-board-wrapper">
                    <canvas id="gameBoard" width="300" height="600"></canvas>
                    <div class="game-overlay" id="gameOverlay">
                        <div class="overlay-content">
                            <h2 id="overlayTitle">准备开始</h2>
                            <p id="overlayMessage">按 空格键 或 点击开始按钮</p>
                            <button class="start-button" id="startButton">开始游戏</button>
                        </div>
                    </div>
                </div>

                <!-- 控制按鈕 -->
                <div class="controls">
                    <button class="control-btn" id="pauseButton">⏸️ 暫停</button>
                    <button class="control-btn" id="restartButton">🔄 重新開始</button>
                    <button class="control-btn" id="soundButton">🔊 音效</button>
                </div>
            </div>

            <!-- 右侧信息面板 -->
            <div class="side-panel right-panel">
                <div class="info-box">
                    <h3>⏭️ 下一個</h3>
                    <canvas id="nextPiece" width="120" height="120"></canvas>
                </div>

                <div class="info-box">
                    <h3>💾 保存的</h3>
                    <canvas id="holdPiece" width="120" height="120"></canvas>
                    <p class="hint-text">按 C 鍵保存方塊</p>
                </div>

                <div class="info-box">
                    <h3>⌨️ 操作說明</h3>
                    <div class="controls-list">
                        <div class="control-item">
                            <span class="key">←→</span>
                            <span>左右移動</span>
                        </div>
                        <div class="control-item">
                            <span class="key">↓</span>
                            <span>加速下落</span>
                        </div>
                        <div class="control-item">
                            <span class="key">↑</span>
                            <span>旋轉</span>
                        </div>
                        <div class="control-item">
                            <span class="key">Space</span>
                            <span>瞬間下落</span>
                        </div>
                        <div class="control-item">
                            <span class="key">C</span>
                            <span>保存方塊</span>
                        </div>
                        <div class="control-item">
                            <span class="key">P</span>
                            <span>暫停</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 移動端控制按鈕 -->
        <div class="mobile-controls">
            <div class="mobile-row">
                <button class="mobile-btn" id="mobileRotate">⟲</button>
                <button class="mobile-btn" id="mobileHold">💾</button>
            </div>
            <div class="mobile-row main-controls">
                <button class="mobile-btn" id="mobileLeft">←</button>
                <button class="mobile-btn" id="mobileDown">↓</button>
                <button class="mobile-btn" id="mobileRight">→</button>
                <button class="mobile-btn" id="mobileDrop">⬇️</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
